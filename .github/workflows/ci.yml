# CI: every gate on every PR and on every push to main (task 0.5).
# Reads no secrets. Actions are pinned by full commit SHA; bump them deliberately.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install (pnpm from package.json via corepack)
        run: corepack pnpm install --frozen-lockfile
      - name: Build, typecheck, lint, test
        run: corepack pnpm turbo run build typecheck lint test

  python-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Install PyYAML (board and workflow tests)
        run: python3 -m pip install --disable-pip-version-check pyyaml
      - name: Harness tests (hooks, board, merge gate, risk labels, workflows)
        run: python3 -m unittest discover -v .claude/tests
      - name: ADR checks
        run: |
          python3 -m unittest discover -v -s docs/adr -p 'test_*.py'
          python3 docs/adr/check-headings.py
      - name: Secret scan
        run: python3 .githooks/secret-scan.py --all
