# CI: every gate on every PR and on every push to main (task 0.5); every PR commit's secret scan (0.9).
# Reads no secrets. Actions are pinned by full commit SHA; bump them deliberately.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Nightly, regardless of what changed: a model/prompt-pack or dependency regression that no commit
  # introduced can still show up here first. Not subject to the docs-only skip below (task 0.13).
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether this run's diff is docs-only, so the heavy `node` job (build/typecheck/lint/test,
  # with Postgres+Redis services) can be skipped for a docs/plan-only push or PR (task 0.13). A plain
  # `git diff --name-only` + stdlib script, not a third-party paths-filter action, so there's nothing new
  # to pin here. `python-harness` and `secrets` are unaffected and always run.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Decide if this run's diff is docs-only
        id: diff
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          else
            base=""
            head=""
          fi
          if [ -n "$base" ] && [ -n "$head" ] && git cat-file -e "$base" 2>/dev/null; then
            git diff --name-only "$base" "$head" > "$RUNNER_TEMP/changed-files.txt"
          else
            : > "$RUNNER_TEMP/changed-files.txt"
          fi
          out=$(python3 .github/scripts/docs_only.py --event-name "${{ github.event_name }}" "$RUNNER_TEMP/changed-files.txt") || true
          echo "docs_only=$out" >> "$GITHUB_OUTPUT"

  node:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Postgres 16 + pgvector for @edmate/db's migration tests (task 1.1): the image docker/compose.yaml
    # pins, by digest. A service container is reachable only from this job's runner; the password
    # is a throwaway for an ephemeral CI database, not a secret.
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16@sha256:33198da2828a14c30348d2ccb4750833d5ed9a44c88d840a0e523d7417120337
        env:
          POSTGRES_USER: edmate
          POSTGRES_PASSWORD: edmate-ci
          POSTGRES_DB: edmate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edmate -d edmate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Redis for @edmate/worker's turn-queue integration test (task 3.8): the image
      # tag docker/compose.yaml uses, pinned by digest. No password: only this job reaches it.
      redis:
        image: redis:7.4.6-alpine@sha256:3b73847e72874be07e6657b129a94761662b79bc0f679273757d4218573b2a98
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      # @edmate/db's integration tests fail (not skip) in CI when this database is unreachable.
      TEST_DATABASE_URL: postgres://edmate:edmate-ci@localhost:5432/edmate
      # @edmate/worker's integration test fails (not skips) in CI when Redis is unreachable.
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install (pnpm from package.json via corepack)
        run: corepack pnpm install --frozen-lockfile
      - name: Build, typecheck, lint, test
        run: corepack pnpm turbo run build typecheck lint test
      # Runs the real, built web app (apps/web/.next/standalone) against real Postgres: the only
      # way to catch a bundler bug that source-level tests can't see (task 1.7b).
      - name: 'Build smoke (apps/web: the age gate on a real production build)'
        run: corepack pnpm turbo run build-smoke --filter=@edmate/web
      # Task 9.7: the student/teacher full-flow e2e suite, against a real `next dev` and this
      # job's own Postgres (`playwright.config.ts`'s `globalSetup`); every model-shaped turn is a
      # `page.route` fixture (apps/web/e2e/fixtures.ts), so no real model or payment call ever
      # runs. `testIgnore: ['stack/**']` keeps task 9.0's docker-compose stack suite out of this
      # job. Chromium only.
      - name: Install Playwright browsers
        run: corepack pnpm --filter @edmate/web exec playwright install --with-deps chromium
      - name: Student/teacher e2e (scripted turns)
        run: corepack pnpm --filter @edmate/web e2e

  python-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Install PyYAML (board and workflow tests)
        run: python3 -m pip install --disable-pip-version-check pyyaml
      - name: Harness tests (hooks, board, merge gate, risk labels, workflows)
        run: python3 -m unittest discover -v .claude/tests
      - name: ADR checks
        run: |
          python3 -m unittest discover -v -s docs/adr -p 'test_*.py'
          python3 docs/adr/check-headings.py
      - name: Secret scan
        run: python3 .githooks/secret-scan.py --all

  # Every PR commit, not just the final tree: a secret added in one commit and deleted in a later one is
  # still public in the history (task 0.9). Main's scanner, allow list and driver are used, never the PR's.
  secrets:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Take the scanner and allow list from main
        run: |
          set -euo pipefail
          git rev-parse --verify origin/main
          mkdir -p "$RUNNER_TEMP/main-scanner/.githooks"
          git show origin/main:.githooks/secret-scan.py > "$RUNNER_TEMP/main-scanner/.githooks/secret-scan.py"
          git show origin/main:.githooks/secret-scan-allow.txt > "$RUNNER_TEMP/main-scanner/.githooks/secret-scan-allow.txt"
          # Bootstrap: until the driver is on main (only the PR that adds it), use the PR's copy.
          if git cat-file -e origin/main:.github/scripts/scan-pr-commits.py 2>/dev/null; then
            git show origin/main:.github/scripts/scan-pr-commits.py > "$RUNNER_TEMP/scan-pr-commits.py"
          else
            echo "::warning::scan-pr-commits.py is not on main yet; using this PR's copy"
            cp .github/scripts/scan-pr-commits.py "$RUNNER_TEMP/scan-pr-commits.py"
          fi
      - name: Scan every commit in origin/main..HEAD
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/scan-pr-commits.py" --scanner "$RUNNER_TEMP/main-scanner/.githooks/secret-scan.py" --base origin/main
