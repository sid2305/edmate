# Test-only Compose override (task 1.1): publishes the local stack's Postgres on 127.0.0.1 so the
# @edmate/db integration tests can reach it from the host. Nothing else changes.
#
#   docker compose -f docker/compose.yaml -f packages/db/test/compose.port.yaml up -d postgres
#   docker compose -f docker/compose.yaml stop postgres
services:
  postgres:
    ports:
      - '127.0.0.1:${EDMATE_PG_TEST_PORT:-55432}:5432'
