id: pedagogy-ask-teacher-zip-lists-en
suite: pedagogy
package: paid
reviewed_by: lead
source: >-
  docs/edmate-harness-build-plan.md lines 427-436 (Ask the teacher, item 1: it can still help with
  the parts that are covered); content/prompt-packs/ask_teacher@1.0.0.md;
  content/demo-teacher/modules/lists-dicts/notes.md §5.1-§5.6 (lists and dictionaries; zip() is
  not in any module)
turns:
  - student: can I loop through two lists at once, like names and scores together, with something like zip()?
    expect:
      max_words: 120
      must_not_contain:
        - 'zip(names, scores) pairs them up'
        - 'use zip() to pair the two lists'
      judge:
        - The reply says zip() is not covered in the teacher's material and that the question has gone to the teacher.
        - Any help it gives is only about looping over one list or a dictionary's items(), not about zip().
