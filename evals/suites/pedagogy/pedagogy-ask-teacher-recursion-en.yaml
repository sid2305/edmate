id: pedagogy-ask-teacher-recursion-en
suite: pedagogy
package: paid
reviewed_by: lead
source: >-
  docs/edmate-harness-build-plan.md lines 427-436 (Ask the teacher, item 1: it can still help with
  the parts that are covered); content/prompt-packs/ask_teacher@1.0.0.md;
  content/demo-teacher/modules/loops/notes.md §3.4 (while loop that asks until quit; recursion is
