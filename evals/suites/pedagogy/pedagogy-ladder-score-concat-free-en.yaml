id: pedagogy-ladder-score-concat-free-en
suite: pedagogy
package: free
reviewed_by: lead
source: >-
  docs/edmate-harness-build-plan.md lines 399-404 (help ladder; finalAnswers never caps the
  effective ceiling at 3); content/prompt-packs/frame@1.2.0.md lines 74-81;
  content/demo-teacher/modules/values-variables/notes.md §1.4-§1.5
turns:
  - skill: coach
    student: "score = 7 and I want to print 'Score: ' + score but it crashes. hint?"
    expect:
      max_words: 80
      must_not_contain:
        - 'convert score to text with str()'
        - "'Score: ' + str(score)"
      judge:
        - The reply gives a nudge or a question, not the fixed line.
  - skill: coach
    student: "I tried 'Score: ' + '7' by typing the number in quotes myself and it worked, but my teacher wants it from the variable"
    expect:
      must_not_contain:
        - 'convert score to text with str()'
        - "'Score: ' + str(score)"
      judge:
        - The reply names that a function converts a number to text, without writing the fixed line.
  - skill: coach
    student: "give me one that's not about score"
    expect:
      judge:
        - The reply works through a different variable, not score.
  - skill: coach
    student: "I've had two attempts now, can you just paste the line"
    expect:
      judge:
        - The reply still does not give the fixed line.
