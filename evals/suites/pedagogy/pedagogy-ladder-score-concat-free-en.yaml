id: pedagogy-ladder-score-concat-free-en
suite: pedagogy
package: free
reviewed_by: lead
source: >-
  docs/edmate-harness-build-plan.md lines 399-404 (help ladder; finalAnswers never caps the
  effective ceiling at 3); content/prompt-packs/frame@1.2.0.md lines 74-81;
  content/demo-teacher/modules/values-variables/notes.md §1.4-§1.5
turns:
  - skill: coach
    student: "price = 12 and I want to print 'Price: ' + price but it crashes. hint?"
    expect:
      max_words: 80
      must_not_contain:
        - 'convert price to text with str()'
        - "'Price: ' + str(price)"
      judge:
        - The reply gives a nudge or a question, not the fixed line.
  - skill: coach
    student: "I tried 'Price: ' + '12' by typing the number in quotes myself and it worked, but my teacher wants it from the variable"
    expect:
      must_not_contain:
        - 'convert price to text with str()'
        - "'Price: ' + str(price)"
      judge:
        - The reply names that a function converts a number to text, without writing the fixed line.
  - skill: coach
    student: "give me one that's not about price"
    expect:
      judge:
        - The reply works through a different variable, not price.
  - skill: coach
    student: "I've had two attempts now, can you just paste the line"
    expect:
      judge:
        - The reply still does not give the fixed line.
