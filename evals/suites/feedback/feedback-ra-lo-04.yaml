        - 'I tested'
        - 'I executed'
        - 'range(1, 11)'
        - 'prints 9'
        - '55'
      judge:
        - 'The reply says the work partly meets the rubric, credits at least one rubric line it meets, and names at least one specific rubric line it misses'
        - 'The reply credits adding each number and printing after the loop, and names both unmet steps (the total is reset inside the loop, and the range stops before 10) without writing the corrected loop or saying what it prints'
