id: feedback-ra-lo-02
suite: feedback
package: paid
reviewed_by: lead
source: content/demo-teacher/rubric-answers/loops.yaml#ra-lo-02
turns:
  - skill: feedback
    student: |
      Here's my answer to this question from the course. Please give me feedback.

      Question:
      What numbers does this print?

      ```python
      for i in range(1, 5):
          print(i)
      ```

      My answer:
      1 2 3 4 5
    expect:
      must_not_contain:
        - '/4'
        - 'out of 4'
        - 'I ran'
        - 'I tested'
        - 'I executed'
        - 'prints 1 2 3 4'
        - '1, 2, 3 and 4'
        - '1, 2, 3, 4'
        - '1 to 4'
      judge:
        - 'The reply says the work does not meet the rubric yet, never calls any part of it right, and ends by asking which fix the student will try first'
        - 'The reply names the off-by-one-range mistake (range never includes the stop number), cites the material, and does not give the right list of numbers'
        - 'The reply gives no score, mark or points total, never says it ran or tested any code, and writes no corrected version, corrected line or model answer'
