# The India locale pack (task 3.10). Every "pending" value below waits for a person to check it
# (see docs/tasks/3.10/handoff.md, "Human inputs needed"). Until the helpline is verified, the
# runtime serves this pack without it: a distress reply gives the country-neutral line (local
# emergency services, someone you trust), and the PII patterns below are still used.
# `edmate content validate content/locales` fails on purpose until a person signs off.
# Agents must never fill in a helpline number, contact or reviewer here: only a person may.
market: IN
languages: [en] # the pilot teaches and replies in English only (18 Oct 2026; crisis replies too, B-14)
timezone: Asia/Kolkata
currency: { code: INR, format: "₹#,##,##0.00" }
payments: { methods: [], provider: tbd } # the provider is decided; it is wired with payments (task 10.1)
helplines:
  - name: Tele-MANAS
    number: pending
    kind: mental_health
    verifiedBy: pending
    verifiedOn: "2026-10-19" # the date this entry was drafted; set to the check date on sign-off
compliance:
  privacyLaw: "DPDP Act 2023 and DPDP Rules 2025"
  minAge: 13
  dataRegion: "United States (hosting decision, 18 Oct 2026)"
  grievance: pending
  parentalConsentRequired: true # learners aged 13 to 17 need verifiable parental consent (DPDP)
reviewedBy: pending
reviewedOn: "2026-10-19" # the date this pack was drafted; set to the review date on sign-off
regulatedDisclaimers:
  investing: "Educational only; not investment advice."
# Byte for byte the patterns @edmate/harness's piiScrub tests run (IN_PII_PATTERNS); a test keeps
# them equal. Order: Aadhaar-like, PAN, UPI id, Indian mobile.
piiPatterns:
  - '(?<!\d)(?!(?:19|20)\d\d[ -]?(?:19|20)\d\d[ -]?(?:19|20)\d\d[ -]?(?!\d))\d{4}(?:\d{8}| \d{4} \d{4}|-\d{4}-\d{4})(?!\d)'
  - '(?<![A-Za-z0-9])[A-Za-z]{5}\d{4}[A-Za-z](?![A-Za-z0-9])'
  - '(?<![\w.\-@])[\w.\-]{2,256}@[A-Za-z][A-Za-z0-9]{1,63}(?![\w.\-@])'
  - '(?<![\d+])(?:\+?91[ \-]?|0)?[6-9]\d{9}(?!\d)'
