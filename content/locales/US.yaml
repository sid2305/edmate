# The United States locale pack (task 1.7 Phase B): signed on 21 Oct 2026 (reviewedBy below).
# Board decision `min-age` (18 Oct 2026): learners are 13+, and US learners need no parental
# consent; because this pack's compliance block is now signed, that waiver
# (parentalConsentRequired: false) applies. The `privacyLaw`, `dataRegion` and `grievance` values
# below are still `pending`: they wait for a person to check them. If `reviewedBy` is ever cleared
# or set back to `pending`, the age rule (packages/content/src/agePolicy.ts) fails closed again and
# US learners aged 13 to 17 need parental consent too, like every other market, with no other
# change needed to this pack.
# Agents must never fill in a helpline number, contact, law or reviewer here: only a person may.
market: US
languages: [en] # the pilot teaches and replies in English only (18 Oct 2026)
timezone: America/New_York # the pack's reference time zone; a learner's own zone is not taken from it
currency: { code: USD, format: "$#,##0.00" }
payments: { methods: [], provider: tbd } # decided per market with payments (task 10.1)
helplines: [] # none until a person verifies one; a distress reply gives the country-neutral line
compliance:
  privacyLaw: pending # which US and state laws apply is for counsel to write
  minAge: 13
  dataRegion: pending
  grievance: pending
  parentalConsentRequired: false # applies: reviewedBy below is signed (see the header)
reviewedBy: sid2305
reviewedOn: "2026-10-21"
regulatedDisclaimers:
  investing: "Educational only; not investment advice."
piiPatterns: [] # the guard's built-in phone, email, card, OTP and name checks still run
