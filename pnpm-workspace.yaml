packages:
  - apps/*
  - packages/*

# Dependency install scripts are off unless listed here as true.
# msgpackr-extract is an optional native speed-up for BullMQ; msgpackr falls back to plain JS.
# pnpm is a root devDependency so Turborepo finds a `pnpm` binary without a global install;
# its install script links the platform binary.
# esbuild (via drizzle-kit, task 1.1) needs no install script: its platform binary is an optional dependency.
# @swc/core and @parcel/watcher (via next-intl 4.14.9, task 9.1 fix round) need no install script either:
# both ship prebuilt platform binaries as optional dependencies.
allowBuilds:
  esbuild: false
  msgpackr-extract: false
  '@swc/core': false
  '@parcel/watcher': false
  pnpm: true

# @napi-rs/canvas is pdfjs-dist's optional native rendering backend (task 5.1b, review LOW).
# Ingest only extracts text (docs/decisions/log.md's pdfjs-dist pin decision), so it is never
# used; this stops its platform binaries from being downloaded at all.
ignoredOptionalDependencies:
  - '@napi-rs/canvas'
