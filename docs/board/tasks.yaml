# Edmate build board — generated from docs/edmate-harness-build-plan.md v0.3 (104 tasks, revised after review), 17 Oct 2026.
# Status: todo | planning | running | review | blocked | done
# deps: task ids, milestone ids (all tasks in it done) or GATE. Milestone-level deps come from the plan;
#       intra-milestone deps were inferred when the board was generated — fix freely.
# needs_decision: keys under `decisions` that must be answered by a human before the task starts.
# risk: risky = you approve the PR (human-approved label) before the lead merges; expert = named human reviewer for content/eval cases.
# priority: P1 = not needed for the pilot. model: models used, recorded by the team lead.
decisions:
  suite-sizes:
    status: decided
    question: 'Platform eval suites (7.2, blocker B-41): grow to the full Evals-table sizes now (+624 cases, about 1,480 builder calls; a live run is about 3,800 calls per model), or MVP sizes for the exit
      gate (locked 100, pedagogy 60, leak 80, safety 250, advice 60, persona 60: +234 cases, about 630 calls; about 2,400 per model) with the rest in 7.2f before the pilot gate?'
    options:
    - MVP sizes now, the rest in 7.2f (M13) before the pilot gate
    - full sizes now (7.2f moves to M7)
    recommendation: the first option
    answer: 'a) MVP sizes for the exit gate: locked 100, pedagogy 60, leak 80, safety 250, advice 60, persona 60; the remaining ~390 cases in task 7.2f before the pilot gate (human, 22 Oct 2026, B-41)'
  gate-thresholds:
    status: decided
    question: 'Quality gate (7.4, blocker B-40): pass thresholds for the feedback (32 cases) and revision (10 cases) suites, whether platform accuracy is covered by each agent''s own accuracy cases, and
      whether the distress near-miss cases are held to 100% or the 99% safety rate'
    options:
    - feedback 70%, revision 80%, platform accuracy covered by per-agent accuracy, near-miss at 99% (all provisional until 7.2)
    - feedback and revision both 80%, the rest as above
    - other numbers
    recommendation: the first option
    answer: a) feedback >= 70% (matches 5.7), revision >= 80% (like pedagogy); platform accuracy covered by each agent's own accuracy cases; near-miss cases held to the 99% safety rate; provisional until
      the 7.2 expert pass (human, 22 Oct 2026, B-40)
  licence:
    status: decided
    question: Code licence
    options:
    - MIT
    - Apache 2.0
    - AGPL
    recommendation: MIT for adoption
    answer: MIT for code. Teachers own their course content (PRD v0.3).
  repo-host:
    status: decided
    question: 'Repo host: private GitHub repo (needs GitHub Pro, ~$4/month, for branch protection) or public now (free)'
    options:
    - Private + GitHub Pro
    - Public now
    recommendation: Private until the exit gate
    answer: Public GitHub repo (branch protection and Actions are free)
  bot-account:
    status: decided
    question: Separate GitHub bot account for agent PRs (makes the human-approved label airtight)
    options:
    - Bot account
    - Your account + hook only
    recommendation: Start with your account + hook; add a bot before the repo goes public
    answer: Private GitHub App (edmate-bot) for all agent git and PR actions
  min-age:
    status: decided
    question: Minimum learner age
    options:
    - 18+ only
    - Also 13–17 with parental consent
    recommendation: 18+ for the MVP
    answer: 13+; US needs no parental consent (COPPA covers under-13); India 13-17 need verifiable parental consent (DPDP); age gate asks country and birth year
  payment-provider:
    status: decided
    question: Payment provider for the pilot market
    options:
    - 'India: Razorpay / Cashfree / Stripe India'
    - 'Global: a merchant of record'
    recommendation: Subscriptions + split payouts to teachers; compare fees
    answer: Razorpay in India (UPI AutoPay, Route split payouts); a merchant of record (e.g. Paddle or Lemon Squeezy) in the US for sales tax; both behind the one Payments port
  mor-provider:
    status: open
    question: 'US merchant of record: Paddle or Lemon Squeezy, and has it accepted Edmate''s model in writing? (B-53)'
    options:
    - Paddle
    - Lemon Squeezy
    - Stripe Billing + Stripe Tax (fallback if refused)
    recommendation: Paddle; get its written OK before 10.1 Phase C
    answer: null
  revenue-share:
    status: open
    question: Edmate's revenue share and floor price per package
    options:
    - '% of each subscription + floor price'
    recommendation: Decide after cost data from 7.6
    answer: null
  transcription:
    status: decided
    question: Transcription
    options:
    - Provider speech-to-text
    - Self-hosted Whisper
    recommendation: Provider API for the MVP
    answer: Provider speech-to-text API behind the Transcriber port (MVP)
  moderation:
    status: decided
    question: Moderation
    options:
    - Classifier only
    - Self-hosted Llama Guard
    - Provider moderation
    recommendation: Provider moderation where available, classifier otherwise
    answer: Provider moderation where available, a local classifier otherwise
  judge-model:
    status: decided
    question: Judge model for evals
    options:
    - Fixed judge on an Edmate key
    recommendation: One mid-tier model, pinned per release
    answer: One mid-tier model (e.g. Claude Sonnet via the Anthropic adapter), pinned per release
  default-model-mix:
    status: decided
    question: Default model mix per tier
    options:
    - By cost and eval results
    recommendation: Decide after 7.6
    answer: b) Sonnet (claude-sonnet-5) for all teaching replies, free and paid; Haiku 4.5 for router, guards and classifiers on every tier; one config table changeable after a live run (human, 22 Oct 2026,
      B-42)
  teacher-chat-visibility:
    status: decided
    question: Do teachers see individual conversations?
    options:
    - Aggregated insights only
    - Students may opt in to share
    recommendation: Aggregated by default; opt-in sharing
    answer: Aggregated insights by default; a student may opt in to share conversations
  refund-policy:
    status: decided
    question: Refund policy
    options:
    - Pro-rata
    - First 7 days full
    - None
    recommendation: First 7 days full refund
    answer: Full refund within the first 7 days; none after
  hosting-region:
    status: decided
    question: Hosting region
    options:
    - A cloud region in the pilot market
    recommendation: Follows the pilot market data rules
    answer: One US cloud region for the pilot; add an India (Mumbai) region later if latency or data rules need it
  pilot-market:
    status: decided
    question: Pilot market (first locale pack)
    options:
    - Where the 20 anchor teachers are, e.g. India or global English
    recommendation: Decide in the Validate phase
    answer: US and India; locale packs en-US and en-IN (English, Hindi, Hinglish)
  pilot-subjects:
    status: decided
    question: Pilot subjects and anchor teachers
    options:
    - Coding
    - Exam prep
    - Languages
    - Professional skills
    recommendation: 1–2 subjects with 20 committed teachers
    answer: Specific practical skills, e.g. personal finance, Marketing 101, start a side hustle; anchor teachers to be signed in the Validate phase
  live-classes:
    status: decided
    question: Live classes in the MVP
    options:
    - Built into Edmate
    - Meet or Zoom link
    recommendation: External link for the MVP
    answer: The teacher's Google Meet or Zoom link; Edmate schedules it and ingests the recording for transcription
  product-name:
    status: decided
    question: Keep the name Edmate?
    options: []
    recommendation: null
    answer: Keep Edmate
  entity:
    status: open
    question: Is Edmate a company, a social enterprise or a non-profit?
    options:
    - Company
    - Social enterprise
    - Non-profit
    recommendation: Decide before payments go live (M10)
    answer: null
  grounding:
    status: decided
    question: What the agent does when the material does not cover a question
    options: []
    recommendation: null
    answer: Teacher's material only; the question goes to the teacher, whose answer returns to the student and becomes a teacher note + eval case
  courses-per-teacher:
    status: decided
    question: Courses (and agents) per teacher in the MVP
    options: []
    recommendation: null
    answer: One per teacher
  mvp-cuts:
    status: decided
    question: Accept the review MVP cuts
    options: []
    recommendation: null
    answer: 'Accepted: email + Google sign-in (no OTP), 2 adapters, manual payouts, study plan + photo upload P1, 50-student load test, manual verification and regulated review'
  scorecard:
    status: decided
    question: Public teaching scorecard on teacher pages
    options: []
    recommendation: null
    answer: Yes, in the MVP
