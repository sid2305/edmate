# Edmate local stack (task 0.2): Postgres 16 + pgvector, Redis, MinIO (S3-compatible), Caddy,
# the Next.js web app, the BullMQ worker and (task 1.4) Mailpit, the sandbox mail catcher.
#
#   docker compose -f docker/compose.yaml up -d --build
#   curl -i localhost:8080/api/health
#   docker compose -f docker/compose.yaml exec worker npm run storage:roundtrip
#
# Runs with no env file: every setting is `${VAR:-dev-default}`, and docker/env.example documents
# each one. The defaults are dev-only placeholders, not secrets; override them for anything shared.
# Only Caddy (and MinIO and Mailpit's UI, for local tools) publish ports, on 127.0.0.1. Data lives in docker/data/
# (gitignored).

name: edmate

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://${POSTGRES_USER:-edmate}:${POSTGRES_PASSWORD:-edmate-dev}@postgres:5432/${POSTGRES_DB:-edmate}
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-edmate-dev}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-edmate-dev}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-edmate-dev-storage}
  S3_FORCE_PATH_STYLE: 'true'

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edmate-dev}
      POSTGRES_DB: ${POSTGRES_DB:-edmate}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-extensions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.6-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Upstream MinIO stopped publishing images; pgsty/minio is a maintained community build of
    # the same server with dated RELEASE tags (see docs/tasks/0.2/handoff.md, Decisions).
    # Pinned by digest so a re-pushed tag can't change what runs. Local development only.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-edmate-dev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-edmate-dev-storage}
      # Upload centre (task 8.2): browsers PUT straight to MinIO with a presigned URL. CORS allows
      # only the web app's origins (Caddy, and `next dev` on the host), never '*'. Presigned URLs
      # carry no cookies, so no credentials are allowed either. Local development only.
      MINIO_API_CORS_ALLOW_ORIGIN: ${AUTH_URL:-http://localhost:8080},http://localhost:3000
    ports:
      - '127.0.0.1:${EDMATE_S3_PORT:-9000}:9000'
      - '127.0.0.1:${EDMATE_S3_CONSOLE_PORT:-9001}:9001'
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    # Sandbox mail catcher for sign-in links (task 1.4). It has no outbound relay, so the sandbox
    # can never email a real person. SMTP (1025) stays on the compose network; the UI and API
    # are published on 127.0.0.1 only. No data volume: caught mail is gone on restart.
    # Pinned by digest (v1.31.6) so a re-pushed tag can't change what runs.
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    restart: unless-stopped
    ports:
      - '127.0.0.1:${EDMATE_MAIL_UI_PORT:-8025}:8025'
    # The image ships its own healthcheck (`/mailpit readyz`).

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: edmate-web:dev
    restart: unless-stopped
    environment:
      <<: *app-env
      # Sign-in (task 1.3); empty by default, so sign-in is off but /api/health still answers.
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_URL: ${AUTH_URL:-http://localhost:8080}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      # Email magic link (task 1.4): Mailpit by default. Production sets any provider's SMTP URL.
      EMAIL_SERVER: ${EMAIL_SERVER:-smtp://mailpit:1025}
      EMAIL_FROM: ${EMAIL_FROM:-Edmate <sign-in@edmate.test>}
      # Upload centre (task 8.2): upload URLs are signed for MinIO's published port (the browser
      # can't reach minio:9000), and this local MinIO speaks plain http, which NODE_ENV=production
      # otherwise refuses. A real deployment sets an https S3_ENDPOINT and neither of these.
      S3_PUBLIC_ENDPOINT: http://localhost:${EDMATE_S3_PORT:-9000}
      S3_ALLOW_HTTP: 'true'
      # Chat (task 9.0). The market picks the locale pack; production fails closed without one.
      EDMATE_MARKET: ${EDMATE_MARKET:-US}
      # Agents students can chat with; in production an unset value means none. The seeded demo agent.
      EDMATE_CHAT_AGENTS: ${EDMATE_CHAT_AGENTS:-demo-agent}
      # Your Anthropic key, from your shell or the ignored docker/.env file. No default.
      EDMATE_ANTHROPIC_API_KEY: ${EDMATE_ANTHROPIC_API_KEY:-}
      # Local-only scripted model (no key): `scripted` works only when AUTH_URL is http://localhost. Off by default.
      EDMATE_DEV_MODEL: ${EDMATE_DEV_MODEL:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    image: edmate-worker:dev
    restart: unless-stopped
    environment:
      <<: *app-env
      # Embedder and Whisper for ingest (task 2.7). No default; not needed when embeddings are off.
      EDMATE_OPENAI_API_KEY: ${EDMATE_OPENAI_API_KEY:-}
      # Local stack: index uploads for full-text search only (chat retrieval is full text, 9.4), so
      # no OpenAI key is needed. `openai` turns embeddings and transcription back on (task 9.0, D3).
      EDMATE_INGEST_EMBEDDINGS: ${EDMATE_INGEST_EMBEDDINGS:-off}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      # The worker has no HTTP port; healthy = its process is up and can reach Redis (its queue).
      test:
        - CMD
        - node
        - -e
        - "require('node:net').connect(6379,'redis').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:${EDMATE_HTTP_PORT:-8080}:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
    depends_on:
      web: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:2019/config/']
      interval: 5s
      timeout: 3s
      retries: 10
